#app{max-width:640px;margin:0 auto;padding:16px 16px 60px;}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:34px 6px 26px;
}
.header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-0.3px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55);}
.header .sub{font-size:12px;color:#eef1f6;margin-top:4px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
.progress-card{
  background:var(--card);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);margin-bottom:16px;
}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.progress-top .big{font-size:26px;font-weight:800;color:var(--accent);}
.progress-top .lbl{font-size:12px;color:var(--muted);}
.bar-track{height:10px;background:var(--line);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8fd8f7);border-radius:999px;transition:width .4s ease;}
.cta-btn{
  display:block;width:100%;text-align:center;
  background:var(--accent);color:var(--accent-ink);
  border:none;padding:16px;border-radius:16px;
  font-size:16px;font-weight:700;margin-top:14px;cursor:pointer;
  box-shadow:0 4px 14px rgba(47,168,224,.35);
}
.cta-btn:active{transform:scale(.98);}
.cta-btn.secondary{
  background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;
}
.section-title{font-size:14px;font-weight:800;margin:22px 4px 10px;color:var(--ink);display:flex;align-items:center;gap:6px;}
.day-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.day-card{
  background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;border:2px solid transparent;
  position:relative;
}
.day-card.today{border-color:var(--accent);}
.day-card .dnum{font-size:12px;color:var(--muted);font-weight:700;}
.day-card .status{font-size:20px;margin:4px 0 2px;}
.day-card .drange{font-size:10px;color:var(--muted);}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:8px 4px 0;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:4px;}

.pos-pill{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;color:#fff;
}
.pos-noun{background:var(--noun);}
.pos-verb{background:var(--verb);}
.pos-iadj{background:var(--iadj);}
.pos-nadj{background:var(--nadj);}
.pos-adv{background:var(--adv);}

.day-detail{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
.page-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 10px;border-radius:12px;margin-bottom:8px;background:var(--bg);
  cursor:pointer;
}
.page-row .left{display:flex;flex-direction:column;gap:4px;}
.page-row .range{font-size:11px;color:var(--muted);}
.page-row .check{font-size:20px;}

.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.iconbtn{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  width:38px;height:38px;display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;flex-shrink:0;
}
.topbar .title{flex:1;}
.topbar .title .t1{font-size:14px;font-weight:800;}
.topbar .title .t2{font-size:11px;color:var(--muted);}
.star-btn{color:#c8a24a;font-size:19px;}
.star-btn.active{background:#fff6df;border-color:#f2b134;color:#e6a412;}

.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 18px;flex-wrap:wrap;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.dot.seen{background:var(--accent);}
.dot.current{background:var(--ink);}

.card-wrap{perspective:1200px;margin-bottom:20px;}
.flashcard{
  position:relative;min-height:340px;border-radius:22px;cursor:pointer;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;
}
.flashcard.flipped{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px 22px;text-align:center;box-shadow:var(--shadow);
}
.face-front{background:var(--card);}
.face-back{background:var(--card);transform:rotateY(180deg);}
.emoji-big{font-size:64px;line-height:1;margin-bottom:14px;}
.badge-fallback{
  width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:26px;font-weight:800;margin-bottom:14px;
}
.jp-word{font-size:32px;font-weight:800;margin-bottom:8px;}
.jp-reading{font-size:16px;color:var(--muted);margin-bottom:14px;}
.tap-hint{position:absolute;bottom:16px;font-size:11px;color:var(--muted);}
.kr-meaning{font-size:24px;font-weight:800;color:var(--accent);margin-bottom:18px;}
.example-box{background:var(--bg);border-radius:14px;padding:14px 16px;width:100%;}
.example-jp{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.5;}
.example-kr{font-size:13px;color:var(--muted);line-height:1.5;}

.nav-row{display:flex;gap:10px;}
.nav-row button{
  flex:1;padding:14px;border-radius:14px;border:none;font-size:15px;font-weight:700;cursor:pointer;
}
.btn-prev{background:var(--card);border:1.5px solid var(--line);color:var(--ink);}
.btn-next{background:var(--ink);color:#fff;}
.btn-done{background:var(--accent);color:#fff;}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .25s ease, bottom .25s ease;
  z-index:50;
}
.toast.show{opacity:1;bottom:36px;}

.celebrate{
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:34px 20px;text-align:center;
}
.celebrate .big-emoji{font-size:54px;margin-bottom:10px;}
.celebrate h2{margin:0 0 8px;font-size:20px;}
.celebrate p{color:var(--muted);font-size:13px;margin:0 0 20px;}

.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;}
.empty-note{text-align:center;color:var(--muted);font-size:13px;padding:26px 10px;line-height:1.6;}
.fav-row{display:flex;align-items:center;justify-content:space-between;padding:12px 10px;border-radius:12px;margin-bottom:8px;background:var(--bg);}
.fav-row .word{display:flex;flex-direction:column;gap:3px;}
.fav-row .word .jp{font-size:15px;font-weight:700;}
.fav-row .word .kr{font-size:12px;color:var(--muted);}
.fav-row .unstar{font-size:18px;color:#e6a412;cursor:pointer;flex-shrink:0;padding:4px 6px;}
</style>
</head>

 "ex_kr": "애초에 왜 가는 겁니까?", "emoji": "🤔"}, {"no": 997, "pos": "부사·접속사", "jp": "改めて", "reading": "あらためて", "kr": "다시/새삼", "ex_jp": "改めてお礼を言います。", "ex_kr": "다시 한번 감사드립니다.", "emoji": "🙏"}, {"no": 998, "pos": "부사·접속사", "jp": "早速", "reading": "さっそく", "kr": "즉시", "ex_jp": "早速始めましょう。", "ex_kr": "즉시 시작합시다.", "emoji": "⚡"}, {"no": 999, "pos": "부사·접속사", "jp": "たまたま", "reading": "たまたま", "kr": "우연히", "ex_jp": "たまたま彼に会いました。", "ex_kr": "우연히 그를 만났습니다.", "emoji": "🎲"}, {"no": 1000, "pos": "부사·접속사", "jp": "どうやら", "reading": "どうやら", "kr": "아무래도/보아하니", "ex_jp": "どうやら雨が降りそうです。", "ex_kr": "아무래도 비가 올 것 같습니다.", "emoji": "🤔"}]}]}

<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('site-data').textContent);
  var PAGES = RAW.pages; // [{pos, words:[{no,pos,jp,reading,kr,ex_jp,ex_kr,emoji}]}]
  var PAGES_PER_DAY = 3;
  var TOTAL_PAGES = PAGES.length;
  var TOTAL_DAYS = Math.ceil(TOTAL_PAGES / PAGES_PER_DAY);

  var STORAGE_KEY = 'jpVocab1000Progress_v1';
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {completedPages:{}, favorites:{}};
      var parsed = JSON.parse(raw);
      if(!parsed.completedPages) parsed.completedPages = {};
      if(!parsed.favorites) parsed.favorites = {};
      return parsed;
    }catch(e){ return {completedPages:{}, favorites:{}}; }
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  var state = loadState();

  var POS_CLASS = {
    "명사":"pos-noun","동사":"pos-verb","い형용사":"pos-iadj","な형용사":"pos-nadj","부사·접속사":"pos-adv"
  };
  var POS_COLOR_VAR = {
    "명사":"--noun","동사":"--verb","い형용사":"--iadj","な형용사":"--nadj","부사·접속사":"--adv"
  };
  var POS_LABEL_SHORT = {
    "명사":"명","동사":"동","い형용사":"い","な형용사":"な","부사·접속사":"부"
  };

  function dayPages(dayIdx){ // 0-based
    var start = dayIdx*PAGES_PER_DAY;
    var arr=[];
    for(var i=start;i<Math.min(start+PAGES_PER_DAY,TOTAL_PAGES);i++) arr.push(i);
    return arr;
  }
  function isPageDone(pIdx){ return !!state.completedPages[pIdx]; }
  function isDayDone(dayIdx){
    var pp = dayPages(dayIdx);
    return pp.length>0 && pp.every(isPageDone);
  }
  function firstIncompleteDay(){
    for(var d=0; d<TOTAL_DAYS; d++){ if(!isDayDone(d)) return d; }
    return TOTAL_DAYS-1;
  }
  function completedPagesCount(){
    var c=0; for(var k in state.completedPages) if(state.completedPages[k]) c++;
    return c;
  }
  function pageWordRange(pIdx){
    var w = PAGES[pIdx].words;
    return w[0].no + '-' + w[w.length-1].no;
  }

  function isFav(no){ return !!state.favorites[no]; }
  function toggleFav(no){
    if(state.favorites[no]) delete state.favorites[no];
    else state.favorites[no] = true;
    saveState();
  }
  function favoriteWords(){
    var out=[];
    PAGES.forEach(function(p){
      p.words.forEach(function(w){ if(isFav(w.no)) out.push(w); });
    });
    return out;
  }
  function favoritesCount(){
    var c=0; for(var k in state.favorites) if(state.favorites[k]) c++;
    return c;
  }

  var app = document.getElementById('app');
  var route = {view:'home'};

  function navigate(r){ route = r; render(); window.scrollTo(0,0); }

  var raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : function(cb){ setTimeout(cb, 16); };
  function toast(msg){
    try{
      var t = document.createElement('div');
      t.className='toast'; t.textContent=msg;
      document.body.appendChild(t);
      raf(function(){ t.classList.add('show'); });
      setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },300); },1600);
    }catch(e){ /* toast is non-critical; never let it block navigation */ }
  }

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html!==undefined) e.innerHTML = html;
    return e;
  }

  // ---------- HOME VIEW ----------
  function renderHome(){
    app.innerHTML = '';
    var header = el('div','header');
    header.innerHTML = '<div><h1>🇯🇵 기초 일본어 1000단어</h1><div class="sub">하루 3쪽, 품사별로 차근차근 암기해요</div></div>';
    app.appendChild(header);

    var done = completedPagesCount();
    var pct = Math.round((done/TOTAL_PAGES)*100);
    var pcard = el('div','progress-card');
    pcard.innerHTML =
      '<div class="progress-top"><div><span class="big">'+pct+'%</span></div>'+
      '<div class="lbl">'+done+' / '+TOTAL_PAGES+'쪽 완료</div></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>';
    var todayDay = firstIncompleteDay();
    var startBtn = el('button','cta-btn', done>=TOTAL_PAGES*0 && !isDayDone(todayDay) ? '▶ 오늘의 학습 시작 (Day '+(todayDay+1)+')' : '🎉 전체 복습하기');
    startBtn.onclick = function(){ navigate({view:'day', day: todayDay}); };
    pcard.appendChild(startBtn);
    var browseBtn = el('button','cta-btn secondary','📖 전체 목차 보기');
    browseBtn.onclick = function(){ navigate({view:'toc'}); };
    pcard.appendChild(browseBtn);
    var favBtn = el('button','cta-btn secondary','⭐ 즐겨찾기 모아보기 ('+favoritesCount()+')');
    favBtn.onclick = function(){ navigate({view:'favorites'}); };
    pcard.appendChild(favBtn);
    app.appendChild(pcard);

    app.appendChild(el('div','section-title','📅 학습 캘린더'));
    var legend = el('div','legend','<span>⚪ 미학습</span><span>🟠 진행중</span><span>✅ 완료</span>');
    app.appendChild(legend);

    var grid = el('div','day-grid');
    for(var d=0; d<TOTAL_DAYS; d++){
      var pp = dayPages(d);
      var doneCount = pp.filter(isPageDone).length;
      var statusIcon = doneCount===0 ? '⚪' : (doneCount===pp.length ? '✅' : '🟠');
      var card = el('div','day-card'+(d===todayDay?' today':''));
      var firstNo = PAGES[pp[0]].words[0].no;
      var lastNo = PAGES[pp[pp.length-1]].words[PAGES[pp[pp.length-1]].words.length-1].no;
      card.innerHTML =
        '<div class="dnum">Day '+(d+1)+'</div>'+
        '<div class="status">'+statusIcon+'</div>'+
        '<div class="drange">'+firstNo+'-'+lastNo+'</div>';
      (function(dd){ card.onclick=function(){ navigate({view:'day', day: dd}); }; })(d);
      grid.appendChild(card);
    }
    app.appendChild(grid);
    app.appendChild(el('div','footer-note','매일 3쪽씩 꾸준히 학습하면 약 '+TOTAL_DAYS+'일 만에 1000단어를 모두 익힐 수 있어요.'));
  }

  // ---------- TOC VIEW ----------
  function renderToc(){
    app.innerHTML = '';
    var topbar = el('div','topbar');
    var back = el('div','iconbtn','←'); back.onclick=function(){ navigate({view:'home'}); };
    topbar.appendChild(back);
    topbar.appendChild(el('div','title','<div class="t1">전체 목차</div><div class="t2">'+TOTAL_PAGES+'쪽 · 1000단어</div>'));
    app.appendChild(topbar);

    var lastPos = null;
    PAGES.forEach(function(p, idx){
      if(p.pos !== lastPos){
        app.appendChild(el('div','section-title','<span class="pos-pill '+POS_CLASS[p.pos]+'">'+p.pos+'</span>'));
        lastPos = p.pos;
      }
      var row = el('div','page-row');
      var doneMark = isPageDone(idx) ? '✅' : '⚪';
      row.innerHTML =
        '<div class="left"><div>'+ (idx+1) +'쪽 · '+p.words[0].no+'-'+p.words[p.words.length-1].no+'번</div>'+
        '<div class="range">'+p.words.length+'개 단어</div></div>'+
        '<div class="check">'+doneMark+'</div>';
      (function(i){ row.onclick=function(){ navigate({view:'study', page:i, from:'toc'}); }; })(idx);
      app.appendChild(row);
    });
  }

  // ---------- DAY VIEW ----------
  function renderDay(dayIdx){
    app.innerHTML = '';
    var topbar = el('div','topbar');
    var back = el('div','iconbtn','←'); back.onclick=function(){ navigate({view:'home'}); };
    topbar.appendChild(back);
    topbar.appendChild(el('div','title','<div class="t1">Day '+(dayIdx+1)+'</div><div class="t2">'+TOTAL_DAYS+'일 중 '+(dayIdx+1)+'일차</div>'));
    app.appendChild(topbar);

    var pp = dayPages(dayIdx);
    var detail = el('div','day-detail');
    pp.forEach(function(pIdx){
      var p = PAGES[pIdx];
      var row = el('div','page-row');
      var doneMark = isPageDone(pIdx) ? '✅' : '⚪';
      row.innerHTML =
        '<div class="left"><div><span class="pos-pill '+POS_CLASS[p.pos]+'">'+p.pos+'</span></div>'+
        '<div class="range">'+p.words[0].no+'-'+p.words[p.words.length-1].no+'번 · '+p.words.length+'개</div></div>'+
        '<div class="check">'+doneMark+'</div>';
      row.onclick = function(){ navigate({view:'study', page:pIdx, from:'day', day:dayIdx}); };
      detail.appendChild(row);
    });
    app.appendChild(detail);

    if(isDayDone(dayIdx)){
      var cel = el('div','celebrate');
      cel.innerHTML = '<div class="big-emoji">🎉</div><h2>Day '+(dayIdx+1)+' 완료!</h2><p>오늘 분량을 모두 학습했어요.</p>';
      var nextBtn = el('button','cta-btn', dayIdx+1<TOTAL_DAYS ? '다음 날로 이동 →' : '처음으로 돌아가기');
      nextBtn.onclick = function(){ navigate({view: dayIdx+1<TOTAL_DAYS?'day':'home', day: dayIdx+1}); };
      cel.appendChild(nextBtn);
      app.appendChild(cel);
    } else {
      var firstUndone = pp.find(function(i){ return !isPageDone(i); });
      var startBtn = el('button','cta-btn','▶ 이어서 학습하기');
      startBtn.onclick = function(){ navigate({view:'study', page: firstUndone, from:'day', day:dayIdx}); };
      app.appendChild(startBtn);
    }
  }

  // ---------- SHARED FLASHCARD DECK RENDERER ----------
  // words: array of word objects. cfg: {routeKey, titleHTML, onBack, showDoneButton, doneLabel, onDone, onLast}
  function renderDeck(words, cfg){
    app.innerHTML = '';
    var wIdx = 0;
    var flipped = false;

    var topbar = el('div','topbar');
    var back = el('div','iconbtn','←');
    back.onclick = cfg.onBack;
    topbar.appendChild(back);
    topbar.appendChild(el('div','title', cfg.titleHTML));
    var starBtn = el('div','iconbtn star-btn','☆');
    topbar.appendChild(starBtn);
    app.appendChild(topbar);

    var dotsWrap = el('div','dots');
    app.appendChild(dotsWrap);

    var cardWrap = el('div','card-wrap');
    var card = el('div','flashcard');
    var faceFront = el('div','face face-front');
    var faceBack = el('div','face face-back');
    card.appendChild(faceFront);
    card.appendChild(faceBack);
    cardWrap.appendChild(card);
    app.appendChild(cardWrap);

    var navRow = el('div','nav-row');
    var prevBtn = el('button','btn-prev','← 이전');
    var nextBtn = el('button','btn-next','다음 →');
    navRow.appendChild(prevBtn);
    navRow.appendChild(nextBtn);
    app.appendChild(navRow);

    var doneBtn = null;
    if(cfg.showDoneButton){
      doneBtn = el('button','cta-btn btn-done', cfg.doneLabel);
      doneBtn.style.marginTop='14px';
      app.appendChild(doneBtn);
    }

    function colorFor(pos){ return getComputedStyle(document.documentElement).getPropertyValue(POS_COLOR_VAR[pos]).trim(); }

    function renderDots(){
      dotsWrap.innerHTML='';
      words.forEach(function(_, i){
        var d = el('span','dot'+(i===wIdx?' current':(i<wIdx?' seen':'')));
        dotsWrap.appendChild(d);
      });
    }

    function renderStar(){
      var fav = isFav(words[wIdx].no);
      starBtn.textContent = fav ? '★' : '☆';
      starBtn.classList.toggle('active', fav);
    }

    function renderCard(){
      var w = words[wIdx];
      flipped = false;
      card.classList.remove('flipped');
      var visual = w.emoji
        ? '<div class="emoji-big">'+w.emoji+'</div>'
        : '<div class="badge-fallback" style="background:'+colorFor(w.pos)+'">'+POS_LABEL_SHORT[w.pos]+'</div>';
      faceFront.innerHTML = visual +
        '<div class="jp-word">'+w.jp+'</div>'+
        '<div class="jp-reading">'+w.reading+'</div>'+
        '<span class="pos-pill '+POS_CLASS[w.pos]+'">'+w.pos+'</span>'+
        '<div class="tap-hint">👆 탭해서 뜻 보기</div>';
      faceBack.innerHTML =
        '<div class="kr-meaning">'+w.kr+'</div>'+
        '<div class="example-box">'+
          '<div class="example-jp">'+(w.ex_jp||'')+'</div>'+
          '<div class="example-kr">'+(w.ex_kr||'')+'</div>'+
        '</div>'+
        '<div class="tap-hint">👆 탭해서 다시 보기</div>';
      renderDots();
      renderStar();
      prevBtn.disabled = (wIdx===0);
      prevBtn.style.opacity = prevBtn.disabled ? .4 : 1;
      nextBtn.textContent = (wIdx===words.length-1) ? '마지막 단어 ✓' : '다음 →';
    }

    card.onclick = function(){
      flipped = !flipped;
      card.classList.toggle('flipped', flipped);
    };
    starBtn.onclick = function(e){
      e.stopPropagation();
      toggleFav(words[wIdx].no);
      renderStar();
      toast(isFav(words[wIdx].no) ? '⭐ 즐겨찾기에 추가했어요' : '즐겨찾기에서 제거했어요');
    };
    prevBtn.onclick = function(e){ e.stopPropagation(); if(wIdx>0){ wIdx--; renderCard(); } };
    nextBtn.onclick = function(e){
      e.stopPropagation();
      if(wIdx < words.length-1){ wIdx++; renderCard(); }
      else if(cfg.onLast){ cfg.onLast(); }
    };
    if(doneBtn) doneBtn.onclick = cfg.onDone;

    document.onkeydown = function(ev){
      if(route.view!==cfg.routeKey) return;
      if(ev.key==='ArrowRight') nextBtn.onclick(ev);
      if(ev.key==='ArrowLeft') prevBtn.onclick(ev);
      if(ev.key===' '){ ev.preventDefault(); card.click(); }
    };

    renderCard();
  }

  // ---------- STUDY (FLASHCARD) VIEW ----------
  function renderStudy(pageIdx, fromCtx){
    var p = PAGES[pageIdx];
    renderDeck(p.words, {
      routeKey: 'study',
      titleHTML:
        '<div class="t1"><span class="pos-pill '+POS_CLASS[p.pos]+'">'+p.pos+'</span></div>'+
        '<div class="t2">'+(pageIdx+1)+'쪽 · '+p.words[0].no+'-'+p.words[p.words.length-1].no+'번</div>',
      onBack: function(){
        if(fromCtx && fromCtx.from==='day') navigate({view:'day', day:fromCtx.day});
        else if(fromCtx && fromCtx.from==='toc') navigate({view:'toc'});
        else if(fromCtx && fromCtx.from==='favorites') navigate({view:'favorites'});
        else navigate({view:'home'});
      },
      showDoneButton: true,
      doneLabel: '✓ 이 쪽 학습 완료',
      onDone: function(){
        state.completedPages[pageIdx] = true;
        saveState();
        toast('✅ '+(pageIdx+1)+'쪽 학습 완료로 저장했어요');
        // auto-advance within same day context if possible
        if(fromCtx && fromCtx.from==='day'){
          var pp = dayPages(fromCtx.day);
          var idxInDay = pp.indexOf(pageIdx);
          if(idxInDay>-1 && idxInDay+1<pp.length){
            navigate({view:'study', page:pp[idxInDay+1], from:'day', day:fromCtx.day});
            return;
          }
          navigate({view:'day', day:fromCtx.day});
          return;
        }
        if(fromCtx && fromCtx.from==='toc'){ navigate({view:'toc'}); return; }
        navigate({view:'home'});
      },
      onLast: function(){ toast('👏 이 쪽의 단어를 모두 살펴봤어요'); }
    });
  }

  // ---------- FAVORITES VIEW ----------
  function renderFavorites(){
    var favs = favoriteWords();
    app.innerHTML = '';
    var topbar = el('div','topbar');
    var back = el('div','iconbtn','←'); back.onclick=function(){ navigate({view:'home'}); };
    topbar.appendChild(back);
    topbar.appendChild(el('div','title','<div class="t1">⭐ 즐겨찾기</div><div class="t2">저장된 단어 '+favs.length+'개</div>'));
    app.appendChild(topbar);

    if(favs.length===0){
      var empty = el('div','day-detail');
      empty.appendChild(el('div','empty-note','아직 즐겨찾기한 단어가 없어요.<br>단어 카드 학습 중 상단의 ☆ 버튼을 눌러 저장해보세요.'));
      app.appendChild(empty);
      return;
    }

    var startBtn = el('button','cta-btn','▶ 즐겨찾기 단어 학습하기');
    startBtn.onclick = function(){
      renderDeck(favs, {
        routeKey: 'favorites',
        titleHTML: '<div class="t1">⭐ 즐겨찾기</div><div class="t2">저장된 단어 '+favs.length+'개</div>',
        onBack: function(){ renderFavorites(); },
        showDoneButton: false,
        onLast: function(){ toast('⭐ 즐겨찾기 단어를 모두 살펴봤어요'); }
      });
    };
    app.appendChild(startBtn);

    var list = el('div','day-detail');
    list.style.marginTop = '14px';
    favs.forEach(function(w){
      var row = el('div','fav-row');
      var left = el('div','word');
      left.innerHTML = '<div class="jp">'+w.jp+' <span style="color:var(--muted);font-weight:400;">'+w.reading+'</span></div><div class="kr">'+w.kr+'</div>';
      var unstar = el('div','unstar','★');
      unstar.onclick = function(){ toggleFav(w.no); renderFavorites(); };
      row.appendChild(left);
      row.appendChild(unstar);
      list.appendChild(row);
    });
    app.appendChild(list);
  }

  function render(){
    document.body.classList.toggle('has-hero', route.view==='home');
    if(route.view==='home') renderHome();
    else if(route.view==='toc') renderToc();
    else if(route.view==='day') renderDay(route.day);
    else if(route.view==='study') renderStudy(route.page, {from:route.from, day:route.day});
    else if(route.view==='favorites') renderFavorites();
    else renderHome();
  }

  render();
})();

</script>
